[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
# WHY: CI'da test "pytest" konsol script'iyle koşar ve bu, repo kökünü sys.path'e
# EKLEMEZ -> "from src..." ModuleNotFoundError verir. (python -m pytest cwd'yi
# eklediği için yerelde sorun görünmez.) pythonpath ile repo kökünü garanti ediyoruz.
pythonpath = .
